<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyVerse Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <img src="logo.svg" alt="StudyVerse logo" class="logo">
    <h1>StudyVerse</h1>
  </header>

  <main>
    <section id="calculator">
      <h2>Midterm grade: <span id="grade-value">75</span>%</h2>
      <input type="range" id="grade-slider" min="0" max="100" value="75">
      <p>CGPA: <span id="cgpa">3.18</span></p>
    </section>
  </main>

</body>
</html>
